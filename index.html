<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agromar — Guriri</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --orange: #E05A35;
      --blue:   #3A9BC1;
      --dark:   #1A2E3A;
      --light:  #F5F9FB;
      --white:  #FFFFFF;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    /* subtle paw pattern background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle at 20% 20%, rgba(58,155,193,0.07) 0%, transparent 50%),
                        radial-gradient(circle at 80% 80%, rgba(224,90,53,0.07) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--white);
      border-radius: 28px;
      padding: 40px 28px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 40px rgba(26,46,58,0.10), 0 2px 8px rgba(26,46,58,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo-wrap {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--white);
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 16px;
      box-shadow: none;
    }

    .logo-wrap svg {
      width: 68px;
      height: auto;
    }

    /* Name + tagline */
    .name {
      font-size: 1.5rem;
      font-weight: 900;
      color: var(--dark);
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }

    .tagline {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--blue);
      margin-bottom: 6px;
      text-align: center;
    }

    .location {
      font-size: 0.80rem;
      color: #7a9aaa;
      font-weight: 600;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .location svg { width: 13px; height: 13px; }

    /* Divider */
    .divider {
      width: 48px;
      height: 3px;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--orange), var(--blue));
      margin-bottom: 28px;
    }

    /* Buttons */
    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 100%;
      padding: 16px 22px;
      border-radius: 16px;
      text-decoration: none;
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 0.97rem;
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
      cursor: pointer;
      border: none;
      animation: fadeUp 0.5s ease both;
    }

    .btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.05);
    }

    .btn:active {
      transform: translateY(0px);
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .btn-icon svg { width: 20px; height: 20px; }

    .btn-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 1px;
    }

    .btn-label {
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0.7;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .btn-main {
      font-size: 1rem;
      font-weight: 900;
    }

    /* WhatsApp */
    .btn-whats {
      background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
      color: white;
      box-shadow: 0 6px 24px rgba(37,211,102,0.30);
      animation-delay: 0.1s;
    }

    .btn-whats .btn-icon { background: rgba(255,255,255,0.18); }

    /* Maps */
    .btn-maps {
      background: linear-gradient(135deg, var(--blue) 0%, #2a7fa8 100%);
      color: white;
      box-shadow: 0 6px 24px rgba(58,155,193,0.28);
      animation-delay: 0.2s;
    }

    .btn-maps .btn-icon { background: rgba(255,255,255,0.18); }

    /* Footer */
    .footer {
      margin-top: 32px;
      font-size: 0.72rem;
      color: #aac3ce;
      font-weight: 600;
      text-align: center;
      letter-spacing: 0.03em;
    }

    .footer span { color: var(--orange); }
  </style>
</head>
